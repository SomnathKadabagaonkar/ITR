<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1-5</title>
</head>

<body>
    <script>
        a = eval(prompt("Enter The Number"))
        if (a == 1) {
            document.write("A")
        }
        else {
            if (a == 2) {
                document.write("B")
            }
            else {
                if (a == 3) {
                    document.write("C")

                }
                else {
                    if (a == 4) {
                        document.write("D")

                    }
                    else {
                        if(a==5)
                    {
                        document.write("E")

                    }
                    else{
                        document.write("Number Undefiened")
                    }
                }
                }
            }
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divisible(5,15,15)</title>
</head>

<body>
    <script>
        a = eval(prompt("enter the number"))
        if (a % 5 == 0) 
        {
            if (a % 10 == 0) 
            {
                if (a % 15 == 0) 
                {
                    document.write("Divisible By 5,10,15")
                }
                else
                {
                    document.write("Divisible By 5,10")

                }
            }
            else
            {
                if (a % 15 == 0) 
                {
                    document.write("Divisible By 5,15")
                }
                else
                {
                document.write("Divisible by 5")
                }
            }
        }
        else
        {
         document.write("Not Divisible By 5,10,15")
        }
    </script>

</body>

</html>

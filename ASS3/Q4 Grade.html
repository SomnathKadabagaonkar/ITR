<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade</title>
</head>

<body>
    <script>
        a = eval(prompt("Enter Your Percentage"))
        if (a >= 90 ) {
            document.write("A grade")
        }
        else {
            if (a >= 70) {
                document.write("B Grade")

            }
            else {
                if (a >= 50) {
                    document.write("C Grade")
                }
                else {
                    if (a >=35) {
                        document.write("D Grade")

                    }
                    else {
                        document.write("Fail")
                    }

                }
            }
        }

    </script>
</body>

</html>

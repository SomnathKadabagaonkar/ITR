<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digits</title>
</head>
<body>
    <script>
        a=eval(prompt("Enter the number"))
        if(a>100)
    {
        document.write("Number Is 3 Digit Number ")
    }
    else
    {
        if(a>10)
    {
                document.write("Number Is 2 Digit Number ")

    }
    else{
                document.write("Number Is 1 Digit Number ")

    }
    }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Largest(3)</title>
</head>
<body>
    <script>
        
        a=eval(prompt("Enter 1st Number"))
        b=eval(prompt("Enter 2nd Number"))
        c=eval(prompt("Enter 3rd Number"))
    if(a>b)
    {
        if(a>c)
        {
        document.write(a+" is Greater")
        } 
        else
        {
        document.write(c+" is Greater")
        }
    }
    else
    {
        if(b>c)
        {
                    document.write(b+" is Greater")
        }
        else
        {
                    document.write(c+" is Greater")
        }
    }
    </script>
</body>
</html>

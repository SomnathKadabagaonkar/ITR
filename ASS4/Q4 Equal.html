<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equal(2no)</title>
</head>
<body>
    
    <script>
        a=eval(prompt("enter 1st number"))
        b=eval(prompt("enter 2nd number"))
        if(a==b)
    {
        document.write("Equal")
    }
    else if(a>b)
    {
              document.write("A is greater")
  
    }
     else
    {
              document.write("B is Greater")
  
    }
   
    
    </script>
</body>
</html>

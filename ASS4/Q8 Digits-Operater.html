<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digits-Operater</title>
</head>
<body>
    <script>
        a=eval(prompt("Enter The Number"))
        if(a>=100 && a<1000)
    {
        document.write("3 Digits Number")
    }
    else if(a>=10 && a<100)
    {
                document.write("2 Digits Number")

    }
    else
    {
                        document.write("1 Digits Number")

    }
    </script>
</body>
</html>

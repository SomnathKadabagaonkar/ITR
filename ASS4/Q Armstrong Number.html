<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random</title>
</head>
<body>
    <script>
        var no,a,b,c,d,e,arm=0;
        no=parseInt(prompt("enter your numer"));
        a=no%10;
        b=Math.floor(no/10);
        c=b%10;
        d=Math.floor(b/10);
        e=d%10;
        arm=a*a*a+c*c*c+e*e*e;
        str=(arm==no)?"Armstrong Number":"Not Armstrong Number"
        document.write(str);



    </script>
</body>
</html>

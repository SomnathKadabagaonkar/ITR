    <title>Vowel Consonent Operater</title>
</head>
<body>
    <script>
        a=prompt("Enter Your Alphabet")
        if(a=='A' ||  a=='E' || a=='I' || a=='O' || a=='U')
    {
        document.write("Vowel")
    }
    else if(a=='a' ||  a=='e' || a=='i' || a=='o' || a=='u')
    {
              document.write("Vowel")
  
    }
    else{
                document.write("Consonent")

    }
    </script>
</body>
</html>

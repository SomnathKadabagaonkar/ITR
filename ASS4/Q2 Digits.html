<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digits Ladder</title>
</head>
<body>
    <script>
        a=eval(prompt("Enter Your Number"))
        if(a>=100)
    {
      document.write("3 Digit Number")
    }
    else if(a>=10)
    {
              document.write("2 Digit Number")

    }
    else{
              document.write("1 Digit Number")

    }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Largest(4)</title>
</head>
<body>
    <script>
     a=eval(prompt("Enter 1st No"))
     b=eval(prompt("Enter 2nd No"))
     c=eval(prompt("Enter 3rd No"))
     d=eval(prompt("Enter 4th No"))
     e=eval(prompt("Enter 4th No"))

     if(a>b && a>c && a>d && a>e)
     {
        document.write("A is Greater")
     }
     else if(b>c && b>d && b>e)
     {
                document.write("B is Greater")

     }
     else if(c>d && c>e)
     {
                document.write("C is Greater")

     }
     else if(d>e)
     {
                document.write("D is Greater")

     }
     else
     {
                document.write("E is Greater")

     }
    </script>
</body>
</html>

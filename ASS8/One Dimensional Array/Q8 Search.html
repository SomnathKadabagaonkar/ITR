<html lang="en">
<head>

</head>
<body>
    <script>
        var arr=new Array(5)
        var key
        var f=0
    for(i=0;i<5;i++)
    {
        arr[i]=eval(prompt("Enter Your Array Of 5 Numbers"))
        document.write("<br>Array :"+arr[i])
    }
    key=eval(prompt("Enter Your Key Value"))
    for(i=0;i<arr.length;i++)
    {
        if(key==arr[i])
    {
        f=1;
    }
    }
if(f==1)
{
    document.write("<br>Key  Found :" +key)
}
else
{
   document.write("<br>Key Not Found")  
}

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum Of EvenOddNumbers</title>
</head>
<body>
    <script>
    
    var sumE=0;
    var sumO=0;
    var arr=new Array(5)
    for(i=0;i<arr.length;i++)
    {
        arr[i]=eval(prompt("Enter The 5 Numbers "))
    }
   for(i=0;i<arr.length;i++)
   {
      if(arr[i]>0)
      {
       sumE=sumE+1
      }
      else
      {
        sumO=sumO+1
      }
   
   }   
    document.write("Positive Numbers :"+sumE)
    document.write("<br>Negative Numbers:"+sumO)


    </script>
</body>
</html>

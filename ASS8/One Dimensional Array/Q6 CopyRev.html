<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy Rev</title>
</head>
<body>
    <script>
    
   
    var arr=new Array(5)
    var arr1=new Array(5)
    for(i=0;i<arr.length;i++)
    {
        arr[i]=eval(prompt("Enter The 5 Numbers "))
          document.write("<br>Array 1 :"+arr[i])
    }
   for(i=arr.length-1;i>=0;i--)
   {
      
    arr1[i]=arr[i]
        document.write("<br>Array 2 :"+arr1[i])

    
   }   
  

    </script>
</body>
</html>

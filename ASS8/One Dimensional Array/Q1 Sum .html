<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum Of Numbers</title>
</head>
<body>
    <script>
    
    var sum=0;
    var arr;
    arr=new Array(10)
    for(i=0;i<arr.length;i++)
    {
        arr[i]=eval(prompt("Enter THe Number"))
    }
   for(i=0;i<arr.length;i++)
   {
      
        sum=sum +arr[i]
        
    
   }   
    document.write(Math.floor(sum))

    </script>
</body>
</html>

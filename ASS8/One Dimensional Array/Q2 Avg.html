<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avg Of Numbers</title>
</head>
<body>
    <script>
    
    var sum=0;
    var arr;
    var avg
    arr=new Array(1,2,3,4,5)
   for(i=0;i<arr.length;i++)
   {
      
        sum=sum +arr[i]
        avg=sum/arr[i]
        
   }   
    document.write("Sum : "+sum)
    document.write("<br>Avg : "+avg)


    </script>
</body>
</html>

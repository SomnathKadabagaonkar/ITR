<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum Of EvenOddNumbers</title>
</head>
<body>
    <script>
    
   
    var arr=new Array(5)
    var min=0;
    for(i=0;i<arr.length;i++)
    {
        arr[i]=eval(prompt("Enter The 5 Numbers "))
        document.write("<br>Array 1 :"+arr[i])
    }
   for(i=0;i<arr.length;i++)
   {
      if(arr[min]>arr[i])
      {
      arr[min]=arr[i];
      }
   }   
   document.write("<br>Minimum Array ="+arr[min])


  

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Functions</title>
</head>
<body>
    <script>
        let str = "Hello";
        document.write(str.length+"<br>")
        document.write(str.toUpperCase()+"<br>")
        document.write(str.toLowerCase()+"<br>")

    </script>
</body>
</html>

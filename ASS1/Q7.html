<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SI</title>
</head>
<body>
    <script>
        p=eval(prompt("Enter Principle Amount"))
        r=eval(prompt("Enter Rate"))
        t=eval(prompt("Enter Time"))
        document.write("SI = "+(p*t*r)/100)
    </script>
</body>
</html>

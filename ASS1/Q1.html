<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Types</title>
    <script >
       
        A=eval(prompt("Enter Your First Number:"))
        B=eval(prompt("Enter Your Second Number:"))

        document.write("<br>(+) Additon="+(A+B))
        document.write("<br>(-) Substraction="+(A-B))
        document.write("<br>(*) Multiplication="+A*B)
        document.write("<br>(/) Division="+A/B)
        document.write("<br>(%) Modulous="+A%B)

        


    </script>
</head>
<body>
    
</body>
</html>

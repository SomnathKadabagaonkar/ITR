<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Square & Cube</title>
</head>
<body>
    <script>
        C=eval(prompt("Enter The Number To find Square Of a Number"))
        document.write("<br>(2^) Square Of a Number = "+C*C)
 
        D=eval(prompt("Enter The Number To find Cube Of a Number"))
        document.write("<br>(3^) Cube Of a Number = "+D*D*D)
    </script>
       
</body>
</html>

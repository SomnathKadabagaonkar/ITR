<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swaping</title>
</head>
<body>
    <script>
    n1=eval(prompt("Enter the 1st Number For Swaping"))
    n2=eval(prompt("Enter the 2nd Number"))
    document.write("<br>Before Swap : N1 ="+n1+" "+"N2 ="+n2)

n1=n1+n2
n2=n1-n2
n1=n1-n2
    document.write("<br>After Swap : N1 ="+n1+" "+"N2 ="+n2)
    </script>
</body>
</html>

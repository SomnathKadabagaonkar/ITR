<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Text using querySelector</title>
</head>
<body>

    <p class="myText">This is the original text.</p>
    <button onclick="changeText()">Change Text</button>

    <script>
        function changeText() 
        {
            var para=document.querySelector(".myText")
            para.innerText = "Text Changed!";
        }
    </script>

</body>
</html>

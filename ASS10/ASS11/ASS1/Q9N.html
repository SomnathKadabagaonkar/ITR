<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Button Text</title>
</head>
<body>

    <button id="myButton" onclick="updateButtonText()">Click Me</button>

    <script>
        function updateButtonText() 
        {
            var para=document.getElementById("myButton")
            para.innerText= "You Clicked Me!";
        }
    </script>

</body>
</html>

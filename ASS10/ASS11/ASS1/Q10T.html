<!DOCTYPE html>
<html>
<head>
  <title>Count Tags</title>
</head>
<body>

  <p>Paragraph 1</p>
  <p>Paragraph 2</p>
  <p>Paragraph 3</p>
  <button onclick="countPTags()">Count & Show</button>

  <script>
    function countPTags() 
    {
      var pTags = document.getElementsByTagName("p");

      alert("Number of <p> tags: " + pTags.length);
    }
  </script>

</body>
</html>

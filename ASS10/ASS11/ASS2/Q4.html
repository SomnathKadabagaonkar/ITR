<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SizeChange -Q4</title>
</head>
<body>
    <p>Select Font Size</p>
    <p id="Mypara">Hi</p>
    <select id="Mypara1" onchange="ChangeSize()">
        <option value="20px">20PX</option>
        <option value="25px">25PX</option>
        <option value="30px">30PX</option>
        <option value="35px">35PX</option>


    </select>
    <script>
        function ChangeSize()
        {
            var para=document.getElementById("Mypara1").value;
            document.getElementById("Mypara").style.fontSize=para;
        }
    </script>
</body>
</html>

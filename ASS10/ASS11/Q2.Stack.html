<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stack Operations</title>
</head>
<body>
    <script>
        arr=new Array(1,2,3,4,5,6,7,8,9)
        arr.push(2)
        document.write("Pushed : "+arr+"<br>")
        arr.pop()
        document.write("Poped : "+arr+"<br>")
        var result=arr.slice(1,3)
        document.write("Sliced : "+result+"<br>")
        var result1=arr.splice(1,1,9)
        document.write("Spliced : "+result1+"<br>")
        arr.unshift(0)
        document.write("Unshift : "+arr+"<br>")
        arr.shift(0)
        document.write("Shift : "+arr+"<br>")
        var result2= arr.indexOf(6)
        document.write("Index Value : "+result2+"<br>")
        var result4=arr.includes(3)
        document.write("Includes() : "+result4+"<br>")
       
    </script>
</body>
</html>

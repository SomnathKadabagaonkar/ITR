<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Unordered List</title>
</head>
<body>
    <script>
        
        for(i=1;i<=100;i++)
        {
            n=i
        var f=0
        for(j=1;j<n;j++)
        {
            if(n%j==0)
        {
            f=f+j;
        }
        }
        if(f==n)
        {
            document.write("<ul><li>"+i+"</ul></li>")
        }
       
        }
    </script>
</body>
</html>

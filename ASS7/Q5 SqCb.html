<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Num Sq Cb  </title>
</head>
<body>
    <script>
        var no,sq,cb;
        no=eval(prompt("Enter The Number"))
        sq=no*no;
        cb=no*no*no;
        document.write("<table border='2px'>")
        document.write("<tr>")
        document.write("<th>Number</th>")
        document.write("<th>Square </th>")
        document.write("<th>Cube </th>")
        document.write("</tr>")
        document.write("<tr>")
        document.write("<td>"+no+"</td>")
        document.write("<td>"+sq+"</td>")
        document.write("<td>"+cb+"</td>")
        document.write("</tr>")
        document.write("</table>")
    </script>
</body>
</html>

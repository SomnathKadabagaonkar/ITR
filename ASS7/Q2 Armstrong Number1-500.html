<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armstrong In Combobox 1-500</title>
</head>
<body>
    <script>
        document.write("<select>")
        for(i=1;i<=500;i++)
        {
         var no=i;
         var org=no;
         var arm=0;
         var rem;   
         while(no>0)
         {
        rem=no%10;
        arm=arm+(rem*rem*rem);
        no=Math.floor(no/10);
        }
      
         if(org==arm)
        {
        
        document.write("<option>"+i+"</option>")
        }
        }
        document.write("</select>")
      
    </script>
</body>
</html>

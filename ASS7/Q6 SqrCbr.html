<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Num Sqr Cbr    </title>
</head>
<body>
    <script>
        var no,sq,cb;
        no=eval(prompt("Enter The Number"))
        sq=Math.sqrt(no);
        cb=Math.cbrt(no);
        document.write("<table border='2px'>")
        document.write("<tr>")
        document.write("<th>Number</th>")
        document.write("<th>Square Root</th>")
        document.write("<th>Cube Root</th>")
        document.write("</tr>")
        document.write("<tr>")
        document.write("<td>"+no+"</td>")
        document.write("<td>"+sq+"</td>")
        document.write("<td>"+cb+"</td>")
        document.write("</tr>")
        document.write("</table>")
    </script>
</body>
</html>

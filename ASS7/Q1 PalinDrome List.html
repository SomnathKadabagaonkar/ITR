<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome In LIst 1-100</title>
</head>
<body>
    <script>
        for(i=1;i<=100;i++)
        {
         var no=i;
         var org=no;
         var rev=0;
         var rem;   
         while(no>0)
         {
        rem=no%10;
        rev=(rev*10)+rem;
        no=Math.floor(no/10);
        }
      
      if(org==rev)
      {
        document.write("<ul><li>"+i+"</li></ul>")
      }
    }
      
    </script>
</body>
</html>

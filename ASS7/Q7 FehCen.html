<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fehrenhiet
    </title>
</head>
<body>
    <script>
        var cen,feh;
        feh=eval(prompt("Enter  Fehrenhite"))
        cen=(feh-32)/1.8;
        document.write("<table border='2px'>")
        document.write("<tr>")
        document.write("<th>Fehrenhiet(T1)</th>")
        document.write("<th>Celcius(T2)</th>")
        
        
        document.write("</tr>")
        document.write("<tr>")
        document.write("<br><td>"+feh+"</td>")
        document.write("<br><td>"+cen+"</td>")
        
      
        document.write("</tr>")
        document.write("</table>")
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factor of Number</title>
</head>
<body>
    <script>
        var r,area=0;
        for(i=0;i<5;i++)
        {
            r=eval(prompt("Enter The Radius of 5 Circle"))
        }        
        for(i=0;i<5;i++)
        {
            area=3.14*r[i]*r[i]
            document.write("Area of Circle"+i+"="+area)
        }    
        
        
    </script>
</body>
</html>

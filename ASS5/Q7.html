<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime No</title>
</head>
<body>
    <script>
        var i,n,f=0;
        n=eval(prompt("Enter The Number"))
        for(let i=2;i<=n/2;i++)
        {
         if(n%i==0)
         {
         f=1;
         } 
        }
        if(f==0)
        {
            document.write("Prime No")

        }
        else
        {
            document.write("Not Prime No")
        }

    </script>
</body>
</html>

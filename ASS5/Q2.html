<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 1-N Even</title>
</head>
<body>
    <script>
        var i,n;
        n=eval(prompt("Enter The Range"))
        for(i=0;i<n;i++)
        {
            if(i%2==0)
            {
                document.write(i+" ")
            }
        }
    </script>
</body>
</html>

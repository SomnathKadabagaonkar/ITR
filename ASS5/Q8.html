<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect No</title>
</head>
<body>
    <script>
        var i,n,f=0;
        n=eval(prompt("Enter The Number"))
        for(let i=1;i<n;i++)
        {
         if(n%i==0)
         {
         f=f+i
         } 
        }
        if(f==n)
        {
            document.write("Perfect No"+f)
        }
        else
        {
            document.write("Not Perfect No")
        }
    </script>
</body>
</html>

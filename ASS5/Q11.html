<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum of Factors</title>
</head>
<body>
    <script>
        var i,n,sum=0;
        n=eval(prompt("Enter The Number"))
        for(let i=1;i<n;i++)
        {
         if(n%i==0)
         {
         sum=sum+i  
         n=n%10   
         } 
        }
        document.write("Sum of Factors"+sum)
        
    </script>
</body>
</html>

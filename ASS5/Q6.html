<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorial No</title>
</head>
<body>
    <script>
        var i,n,fact=1;
        n=eval(prompt("Enter The Range"))
        for(let i=1;i<=n;i++)
        {
         fact=fact*i;  
        }
        document.write("Factorial No="+fact)

    </script>
</body>
</html>

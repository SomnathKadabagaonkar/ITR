<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Q10 Noawait</title>
</head>

<body>
    <script>
        function Userdata() 
        {
            return new Promise((resolve) => {
                setTimeout(() => {
                    resolve("John Doe");
                }, 1000);
            });
        }


        async function getUser() 
        {
            const user =  Userdata(); //No Await IS Uesd 
            console.log("If Await Is Not Used, Then Promise Will Move To Pending state...")
            console.log(user);
        }

        getUser();
    </script>
</body>
</html>

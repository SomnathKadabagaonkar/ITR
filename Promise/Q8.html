<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q8</title>
</head>
<body>
    <script>
        const myPromise1 = new Promise((resolve) => resolve("Data Received From Promise 1"));
        const myPromise2 = new Promise((resolve) => resolve("Data Received From Promise 2"));

        async function Result()
        {
            const res=await Promise.all([myPromise1,myPromise2]);
            console.log("The Both Promises Are Displayed")
            console.log(res[0])
            console.log(res[1])
        }
        Result();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odd||Evan</title>
</head>
<body>
    <script>
    no=eval(prompt("Enter the number : "))
    if(no%2==0)
    {
        document.write("<h1 style='color:green'>Even</h1>")
    }
    if(no%2==1)
    {
        document.write("<h1 style='color:red'>Odd</h1>")
    }
    </script>
</body>
</html>

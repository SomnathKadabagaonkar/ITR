<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PASS-FAIL</title>
</head>
<body>
    <script>
    mark=eval(prompt("Enter the number : "))
    if(mark>35)
    {
        document.write("<h1 style='color:green'>PASS</h1>")
    }
    if(mark<35)
    {
        document.write("<h1 style='color:red'>FAIL</h1>")
    }
    </script>
</body>
</html>

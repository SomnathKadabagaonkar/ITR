<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senior Or Not</title>
</head>
<body>
     <script>
    age=eval(prompt("Enter Your Age: "))
    if(age>55)
    {
        document.write("<h1 style='color:blue'>Senior Citizen</h1>")
    }
    else
    {
        document.write("<h1 style='color:green'>Not Senior Citizen</h1>")
    }
    </script>
</body>
</html>

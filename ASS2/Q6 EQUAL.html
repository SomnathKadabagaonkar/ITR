</head>
<body>
      <script>
    no1=eval(prompt("Enter the 1st number : "))
    no2=eval(prompt("Enter the 2nd number : "))

 
    if(no1==no2)
    {
        document.write("<h1 style='color:green'>Numbers Are Equal</h1>")
    }
    else    {
        document.write("<h1 style='color:red'>Not Equal</h1>")
    }
    </script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse</title>
</head>
<body>
    <script>
        var no,ecount=0,ocount=0,i=0;
        no=eval(prompt("Enter the Number"))
        while(i<=no)
        {
        if(i%2==0)
        {
            ecount=ecount+1;
            i++;
            
        }
        else
        {
        ocount=ocount+1;
        i++;
        }
        }
    document.write("even"+ecount)
    document.write("odd"+ocount)
    </script>
</body>
</html>

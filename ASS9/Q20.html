<html>
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Volume Of Sphere</title>
    </head>
    <body>
        <script>
            function sphere(r)
            {
                vol=1.33*3.14*r*r*r
                return vol
            }
            var r=eval(prompt("Enter Radius"))
            document.write("Volume Of Sphere="+sphere(r))
        </script>
    </body>
    </html>
</html>

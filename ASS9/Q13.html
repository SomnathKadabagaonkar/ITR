<html>
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Eligible For Vote</title>
    </head>
    <body>
        <script>
            function age()
            {
                var age;
                age=eval(prompt("Enter Any Year"))
                if(age>18)
                {
                    document.write("Eligible For Vote")
                }
                else
                {
                    document.write("Not Eligible For Vote")
                }
            }
            age()
        </script>
    </body>
    </html>
</html>

<html>
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Armstrong No</title>
    </head>
    <body>
        <script>
            function armstrong()
            {
                var arm=0,rem,n;
                n=eval(prompt("Enter Any No"))
                var org=n
                while(n>0)
                {
                    rem=n%10
                    arm=rem*rem*rem+arm
                    n=Math.floor(n/10)
                }
                if(org==arm)
                {
                    document.write("Armstrong No")
                }
                else
                {
                    document.write("Not Armstrong No")
                }
            }
            armstrong()
        </script>
    </body>
    </html>
</html>

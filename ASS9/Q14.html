<html>
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Simple Interest</title>
    </head>
    <body>
        <script>
            function SI(p,r,t)
            {
                si=(p*r*t)/100
                document.write("<h3>Simple Interest="+si)
            }
                var p,r,t,si;
                p=eval(prompt("Enter Principal Amount"))
                r=eval(prompt("Enter Rate"))
                t=eval(prompt("Enter Time"))
            SI(p,r,t)
        </script>
    </body>
    </html>
</html>

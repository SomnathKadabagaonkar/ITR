<html>
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Area of Circle</title>
    </head>
    <body>
        <script>
            function circle(r)
            {
                area=3.14*r*r
                return area
            }
            var r=eval(prompt("Enter Radius"))
            document.write("Area of Circle="+circle(r))
        </script>
    </body>
    </html>
</html>

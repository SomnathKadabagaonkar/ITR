<html>
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sum Of Digit</title>
    </head>
    <body>
        <script>
            function Sum(n)
            {
                var sum=0,rem;
                
                while(n>0)
                {
                    rem=n%10
                    sum=sum+rem
                    n=Math.floor(n/10)
                }
                return sum
            }
            n=eval(prompt("Enter Any No"))
            sum=Sum(n)
            document.write("Sum Of Digit="+sum)
        </script>
    </body>
    </html>
</html>

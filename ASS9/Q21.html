<html>
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Area Of Rhombus</title>
    </head>
    <body>
        <script>
            function rhombus(d1,d2)
            {
                area=0.5*d1*d2
                return area
            }
            var d1=eval(prompt("Enter 1st Diagonal"))
            var d2=eval(prompt("Enter 2nd Diagonal"))
            document.write("Area Of Rhombus="+rhombus(d1,d2))
        </script>
    </body>
    </html>
</html>

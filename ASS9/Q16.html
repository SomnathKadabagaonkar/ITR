<html>
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Factorial</title>
    </head>
    <body>
        <script>
            function fact(n)
            {
                var f=1,i=1;
                for(i=1;i<=n;i++)
                {
                    f=f*i
                }
                document.write("<h3>Factorial="+f)
            }
            var n=eval(prompt("Enter Any Number"))
            fact(n)
        </script>
    </body>
    </html>
</html>

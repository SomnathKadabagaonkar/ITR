<html>
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Prime No</title>
    </head>
    <body>
        <script>
            function prime()
            {
                var f=0,i=1,n;
                n=eval(prompt("Enter Any Number"))
                for(i=2;i<n/2;i++)
                {
                    if(n%i==0)
                    {
                        f++
                        break
                    }
                }
                    if(f==0)
                    {
                        document.write("<h3>Prime No")
                    }
                    else
                    {
                        document.write("<h3> Not Prime No") 
                    }
            }
            prime()
        </script>
    </body>
    </html>
</html>

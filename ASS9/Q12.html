<html>
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Leap Year</title>
    </head>
    <body>
        <script>
            function leap()
            {
                var y;
                y=eval(prompt("Enter Any Year"))
                if(y%4==0)
                {
                    document.write("Leap Year")
                }
                else
                {
                    document.write("Not Leap Year")
                }
            }
            leap()
        </script>
    </body>
    </html>
</html>

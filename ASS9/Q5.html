<html>
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fibonacci Series</title>
    </head>
    <body>
        <script>
            function fibo()
            {
                var f1=0,f2=1,f3,i,n;
                n=eval(prompt("Enter Range"))
                document.write(f1+" "+f2+" ")
                for(i=0;i<n;i++)
                {
                    f3=f1+f2
                    f1=f2
                    f2=f3
                    document.write(f3+" ")
                }
            }
            fibo()
        </script>
    </body>
    </html>
</html>

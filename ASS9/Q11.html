<html>
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pass/Fail</title>
    </head>
    <body>
        <script>
            function res()
            {
                var per;
                per=eval(prompt("Enter Your Percentage"))
                if(per>=35)
                {
                    document.write("Pass")
                }
                else
                {
                    document.write("Fail")
                }
            }
            res()
        </script>
    </body>
    </html>
</html>

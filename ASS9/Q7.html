<html>
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sum Of Digit</title>
    </head>
    <body>
        <script>
            function sum()
            {
                var sum=0,rem,n;
                n=eval(prompt("Enter Any No"))
                while(n>0)
                {
                    rem=n%10
                    sum=sum+rem
                    n=Math.floor(n/10)
                }
                document.write("Sum Of Digit="+sum)
            }
            sum()
        </script>
    </body>
    </html>
</html>

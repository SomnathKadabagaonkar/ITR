<html>
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Palindrome No</title>
    </head>
    <body>
        <script>
            function Palindrome()
            {
                var rev=0,rem,n;
                n=eval(prompt("Enter Any No"))
                org=n
                while(n>0)
                {
                    rem=n%10
                    rev=rev*10+rem
                    n=Math.floor(n/10)
                }
                if(org==rev)
                {
                    document.write("Palindrome No")
                }
                else
                {
                    document.write(" Not Palindrome No")
                }
            }
            Palindrome()
        </script>
    </body>
    </html>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even Or Odd</title>
</head>
<body>
    <script>
        const num = [2,3,4];
        const res = num.map(n=>n%2==0 ? "Even":"Odd");
        console.log(res);
    </script>
</body>
</html>

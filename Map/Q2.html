<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celcius to Fherhenite</title>
</head>
<body>
    <script>
        var Celcius=[0,10,20]
        var c=0;
        var Fherhenite=Celcius.map(function(c){
            return (c*1.8)+32
        })
        console.log(Fherhenite)
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extracting Names</title>
</head>
<body>
    <script>
       const users=[
        {name:"Alice",age:25},
        {name:"Bob",age:22}
    ]
        var res=users.map(user=>user.name)
        console.log(res)
    </script>
</body>
</html>
